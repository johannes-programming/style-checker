[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=77.0",
]

[project]
name = "style-checker"
version = "0.2.6"
description = "Check style."
readme = "README.rst"
keywords = []
license = "MIT"
license-files = [
    "LICENSE.txt",
]
authors = [
    { name = "Johannes", email = "johannes.programming@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Typing :: Typed",
]
dependencies = []
urls.Download = "https://pypi.org/project/style-checker/#files"
urls.Index = "https://pypi.org/project/style-checker/"
urls.Source = "https://github.com/johannes-programming/style-checker/"
urls.Website = "https://style-checker.johannes-programming.online/"

[tool.ruff]
line-length = 79
extend-exclude = [
    "tests/examples",
]
lint.select = [
    "ANN001",
    "ANN002",
    "ANN003",
    "F",
    "I",
    "PLE0604",
    "PLE0605",
    "RUF022",
    "RUF068",
    "UP035",
]

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
max_supported_python = "3.11"

[tool.mypy]
files = [
    ".",
]
python_version = "3.11"
strict = true
